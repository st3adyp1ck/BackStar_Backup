[package]
name = "backstar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BackStar - versioned Windows backup"

[lib]
name = "backstar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "BackStar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backstar-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
uuid.workspace = true

# For the F27 process snapshot (Toolhelp) in lockcheck.rs.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"

name: Release

# Push a version tag (v2.1.0, v2.1.1, ...) to build, sign, and publish a GitHub release.
# tauri-action also generates and uploads latest.json, the manifest installed apps poll
# for updates (see the updater plugin config in backstar/src-tauri/tauri.conf.json).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backstar/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backstar

      - name: Install frontend dependencies
        working-directory: backstar
        run: pnpm install --frozen-lockfile

      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backstar
          tagName: ${{ github.ref_name }}
          releaseName: BackStar v__VERSION__
          releaseDraft: false
          prerelease: false
